name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip -q HaiderStudio-Android-Source.zip -d source

      - name: Test and build
        working-directory: source/HaiderStudioAndroid
        run: bash gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: HaiderStudio-APK
          path: source/HaiderStudioAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
